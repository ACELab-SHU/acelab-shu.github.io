<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ACE-Lab Logo Options</title>
  <style>
    :root {
      color: #172033;
      background: #f7fafc;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      margin: 0;
      padding: 40px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 34px;
      letter-spacing: 0;
    }
    p {
      margin: 0 0 28px;
      color: #66788a;
      font-size: 17px;
    }
    .board {
      display: block;
      width: min(100%, 1200px);
      height: auto;
      border: 1px solid #d9e2ec;
      background: white;
    }
    .grid {
      width: min(100%, 1200px);
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 18px;
      margin-top: 28px;
    }
    .item {
      background: white;
      border: 1px solid #d9e2ec;
      border-radius: 8px;
      padding: 18px;
    }
    .item img {
      display: block;
      width: 100%;
      height: auto;
    }
    .item strong {
      display: block;
      margin-bottom: 12px;
      color: #516173;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <h1>ACE-Lab Logo Options</h1>
  <p>Six vector directions for review. The individual SVG files are in this same folder.</p>
  <img class="board" src="acelab-logo-options.svg" alt="ACE-Lab logo concept board">
  <div class="grid">
    <div class="item"><strong>A. Signal Aperture</strong><img src="acelab-logo-a-signal-aperture.svg" alt=""></div>
    <div class="item"><strong>B. Neural Chip</strong><img src="acelab-logo-b-neural-chip.svg" alt=""></div>
    <div class="item"><strong>C. Edge Cube</strong><img src="acelab-logo-c-edge-cube.svg" alt=""></div>
    <div class="item"><strong>D. Wave Monogram</strong><img src="acelab-logo-d-wave-monogram.svg" alt=""></div>
    <div class="item"><strong>E. Academic Seal</strong><img src="acelab-logo-e-academic-seal.svg" alt=""></div>
    <div class="item"><strong>F. Precision Wordmark</strong><img src="acelab-logo-f-precision-wordmark.svg" alt=""></div>
  </div>
</body>
</html>
