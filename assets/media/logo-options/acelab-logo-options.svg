<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ACE-Lab logo concept board</title>
  <desc id="desc">Six vector logo directions for ACE-Lab.</desc>
  <defs>
    <style>
      .bg { fill: #f7fafc; }
      .card { fill: #ffffff; stroke: #d9e2ec; stroke-width: 2; }
      .caption { fill: #516173; font: 600 22px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .word { fill: #172033; font: 800 58px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .word-small { fill: #172033; font: 800 48px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .sub { fill: #66788a; font: 500 17px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .mono { fill: #172033; font: 900 72px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .mono-small { fill: #172033; font: 900 52px Arial, Helvetica, sans-serif; letter-spacing: 0; }
      .blue { fill: #1266d6; }
      .cyan { fill: #1fb6d1; }
      .teal { fill: #17a398; }
      .green { fill: #7ac943; }
      .orange { fill: #ff9f1c; }
      .slate { fill: #223044; }
      .line-blue { fill: none; stroke: #1266d6; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      .line-cyan { fill: none; stroke: #1fb6d1; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; }
      .line-teal { fill: none; stroke: #17a398; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
      .line-slate { fill: none; stroke: #223044; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1266d6"/>
      <stop offset="1" stop-color="#17a398"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#223044"/>
      <stop offset="0.55" stop-color="#1266d6"/>
      <stop offset="1" stop-color="#1fb6d1"/>
    </linearGradient>
    <marker id="dotBlue" markerWidth="12" markerHeight="12" refX="6" refY="6">
      <circle cx="6" cy="6" r="5" fill="#1266d6"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1120"/>
  <text x="80" y="88" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800">ACE-Lab logo concepts</text>
  <text x="80" y="126" fill="#66788a" font-family="Arial, Helvetica, sans-serif" font-size="20">Advanced Communication and Computing Electronics Lab, Shanghai University</text>

  <g transform="translate(80 180)">
    <rect class="card" width="455" height="255" rx="8"/>
    <text class="caption" x="28" y="44">A. Signal Aperture</text>
    <g transform="translate(38 78)">
      <path d="M58 128 L116 18 L174 128" class="line-blue"/>
      <path d="M82 86 H150" class="line-cyan"/>
      <path d="M172 36 C220 58 250 88 266 128" class="line-teal"/>
      <path d="M192 16 C262 42 306 82 330 128" fill="none" stroke="#17a398" stroke-width="5" stroke-linecap="round" opacity=".45"/>
      <circle cx="333" cy="128" r="8" class="orange"/>
      <circle cx="271" cy="128" r="6" class="cyan"/>
      <text class="word" x="205" y="85">ACE</text>
      <text class="word-small" x="316" y="85">Lab</text>
      <text class="sub" x="207" y="113">communication x computing</text>
    </g>
  </g>

  <g transform="translate(575 180)">
    <rect class="card" width="455" height="255" rx="8"/>
    <text class="caption" x="28" y="44">B. Neural Chip</text>
    <g transform="translate(42 76)">
      <rect x="10" y="16" width="116" height="116" rx="20" fill="#eef6ff" stroke="#1266d6" stroke-width="8"/>
      <rect x="40" y="46" width="56" height="56" rx="10" fill="url(#g1)"/>
      <path d="M22 6 V16 M50 6 V16 M78 6 V16 M106 6 V16 M22 132 V146 M50 132 V146 M78 132 V146 M106 132 V146 M0 32 H12 M0 68 H12 M0 104 H12 M126 32 H140 M126 68 H140 M126 104 H140" class="thin" stroke="#1266d6"/>
      <path d="M54 74 C70 52 86 54 95 72 C106 94 82 110 62 96 C48 86 42 98 36 104" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
      <text class="word" x="168" y="74">ACE</text>
      <text class="word-small" x="279" y="74">Lab</text>
      <text class="sub" x="171" y="105">AI hardware and edge systems</text>
    </g>
  </g>

  <g transform="translate(1070 180)">
    <rect class="card" width="455" height="255" rx="8"/>
    <text class="caption" x="28" y="44">C. Edge Cube</text>
    <g transform="translate(42 74)">
      <path d="M70 10 L130 44 V114 L70 150 L10 114 V44 Z" fill="#effaf8" stroke="#17a398" stroke-width="7" stroke-linejoin="round"/>
      <path d="M70 10 V78 L130 44 M70 78 L10 44 M70 78 V150" fill="none" stroke="#1266d6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="70" cy="78" r="12" fill="#ff9f1c"/>
      <path d="M138 82 C170 76 198 88 218 114" fill="none" stroke="#1266d6" stroke-width="7" stroke-linecap="round"/>
      <path d="M145 53 C196 42 236 62 264 98" fill="none" stroke="#1fb6d1" stroke-width="5" stroke-linecap="round" opacity=".75"/>
      <text class="word" x="168" y="76">ACE</text>
      <text class="word-small" x="279" y="76">Lab</text>
      <text class="sub" x="171" y="108">edge AI x 6G electronics</text>
    </g>
  </g>

  <g transform="translate(80 495)">
    <rect class="card" width="455" height="255" rx="8"/>
    <text class="caption" x="28" y="44">D. Wave Monogram</text>
    <g transform="translate(42 78)">
      <path d="M16 128 L70 20 L124 128" fill="none" stroke="#223044" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M42 82 H98" fill="none" stroke="#223044" stroke-width="10" stroke-linecap="round"/>
      <path d="M132 36 C94 54 94 104 134 122 C169 138 210 118 218 78" fill="none" stroke="#1266d6" stroke-width="13" stroke-linecap="round"/>
      <path d="M172 48 C206 26 246 30 276 58 C306 86 342 88 370 66" fill="none" stroke="#17a398" stroke-width="8" stroke-linecap="round"/>
      <text class="word-small" x="176" y="128">ACE-Lab</text>
    </g>
  </g>

  <g transform="translate(575 495)">
    <rect class="card" width="455" height="255" rx="8"/>
    <text class="caption" x="28" y="44">E. Academic Seal</text>
    <g transform="translate(42 74)">
      <circle cx="76" cy="76" r="68" fill="#ffffff" stroke="#223044" stroke-width="7"/>
      <circle cx="76" cy="76" r="48" fill="#eef6ff" stroke="#1266d6" stroke-width="6"/>
      <path d="M47 96 L76 36 L105 96 M60 72 H92" fill="none" stroke="#223044" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M34 116 C62 132 93 132 120 116" fill="none" stroke="#17a398" stroke-width="6" stroke-linecap="round"/>
      <circle cx="76" cy="76" r="8" fill="#ff9f1c"/>
      <text class="word" x="168" y="76">ACE</text>
      <text class="word-small" x="279" y="76">Lab</text>
      <text class="sub" x="171" y="108">Shanghai University</text>
    </g>
  </g>

  <g transform="translate(1070 495)">
    <rect class="card" width="455" height="255" rx="8"/>
    <text class="caption" x="28" y="44">F. Precision Wordmark</text>
    <g transform="translate(42 82)">
      <text class="mono" x="0" y="80">ACE</text>
      <rect x="153" y="37" width="50" height="10" rx="5" fill="#17a398"/>
      <text class="mono-small" x="215" y="80">Lab</text>
      <path d="M4 104 H124 M221 104 H347" fill="none" stroke="#1266d6" stroke-width="7" stroke-linecap="round"/>
      <circle cx="154" cy="104" r="7" fill="#ff9f1c"/>
      <circle cx="194" cy="104" r="7" fill="#17a398"/>
      <text class="sub" x="4" y="134">clean website-first logo</text>
    </g>
  </g>

  <g transform="translate(80 810)">
    <text x="0" y="0" fill="#172033" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800">Quick notes</text>
    <text x="0" y="42" fill="#516173" font-family="Arial, Helvetica, sans-serif" font-size="20">A and D emphasize wireless communication. B and C emphasize chips, AI, and edge computing. E feels more institutional. F is the safest navbar mark.</text>
    <text x="0" y="78" fill="#516173" font-family="Arial, Helvetica, sans-serif" font-size="20">All concepts are vector SVG and can be recolored, simplified, or converted into the current site header logo.</text>
  </g>
</svg>
